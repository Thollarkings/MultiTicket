<header class="header">
    <nav class="nav container">
        <div class="logo">TicketWave</div>
        <ul class="nav-links">
            <li><a href="#dashboard">Dashboard</a></li>
            <li><a href="#tickets">Tickets</a></li>
            <li><button id="logoutBtn" class="btn btn-secondary" style="background: transparent; color: #64748b; border: 1px solid #64748b;">Logout</button></li>
        </ul>
    </nav>
</header>

<main class="container" style="padding-top: 6rem; padding-bottom: 2rem;">
    <div class="dashboard-header" style="margin-bottom: 3rem;">
        <h1>Dashboard</h1>
        <p>Welcome back! Here's your support overview.</p>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 3rem;">
        <div class="stat-card card" style="text-align: center;">
            <h3 id="total-tickets" style="font-size: 2.5rem; color: #3b82f6; margin-bottom: 0.5rem;">0</h3>
            <p style="color: #64748b;">Total Tickets</p>
        </div>
        <div class="stat-card card" style="text-align: center;">
            <h3 id="open-tickets" style="font-size: 2.5rem; color: #10b981; margin-bottom: 0.5rem;">0</h3>
            <p style="color: #64748b;">Open</p>
        </div>
        <div class="stat-card card" style="text-align: center;">
            <h3 id="inProgress-tickets" style="font-size: 2.5rem; color: #f59e0b; margin-bottom: 0.5rem;">0</h3>
            <p style="color: #64748b;">In Progress</p>
        </div>
        <div class="stat-card card" style="text-align: center;">
            <h3 id="closed-tickets" style="font-size: 2.5rem; color: #64748b; margin-bottom: 0.5rem;">0</h3>
            <p style="color: #64748b;">Closed</p>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem;">
        <div class="action-card card" style="text-align: center; padding: 2rem;">
            <h3 style="margin-bottom: 1rem;">Manage Tickets</h3>
            <p style="color: #64748b; margin-bottom: 1.5rem;">View and manage all your support tickets</p>
            <a href="#tickets" class="btn btn-primary">Go to Tickets</a>
        </div>
        <div class="action-card card" style="text-align: center; padding: 2rem;">
            <h3 style="margin-bottom: 1rem;">Create Ticket</h3>
            <p style="color: #64748b; margin-bottom: 1.5rem;">Create a new support ticket</p>
            <button onclick="ticketsModule.openCreateModal()" class="btn btn-primary">Create Ticket</button>
        </div>
    </div>
</main>
