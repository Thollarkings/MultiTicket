<header class="header">
    <nav class="nav container">
        <div class="logo">TicketWave</div>
        <ul class="nav-links">
            <li><a href="#dashboard">Dashboard</a></li>
            <li><a href="#tickets">Tickets</a></li>
            <li><button id="logoutBtn" class="btn btn-secondary" style="background: transparent; color: #64748b; border: 1px solid #64748b;">Logout</button></li>
        </ul>
    </nav>
</header>

<main class="container" style="padding-top: 6rem; padding-bottom: 2rem;">
    <div class="tickets-header" style="display: flex; justify-content: between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
        <div>
            <h1>Ticket Management</h1>
            <p>Manage all your support tickets in one place</p>
        </div>
        <button onclick="ticketsModule.openCreateModal()" class="btn btn-primary">Create New Ticket</button>
    </div>

    <!-- Tickets Grid -->
    <div id="ticketsContainer" class="tickets-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem;">
        <!-- Tickets will be dynamically loaded here -->
    </div>
</main>

<!-- Create Ticket Modal -->
<div id="createTicketModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000;">
    <div class="modal-content card" style="width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto;">
        <div class="modal-header" style="display: flex; justify-content: between; align-items: center; margin-bottom: 1.5rem;">
            <h3>Create New Ticket</h3>
            <button onclick="ticketsModule.closeCreateModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
        </div>
        
        <form id="createTicketForm">
            <div class="form-group">
                <label class="form-label" for="title">Title *</label>
                <input type="text" class="form-input" id="title" name="title" required>
                <div class="form-error"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="description">Description</label>
                <textarea class="form-input" id="description" name="description" rows="4" placeholder="Optional description"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="status">Status *</label>
                <select class="form-input" id="status" name="status" required>
                    <option value="open">Open</option>
                    <option value="in_progress">In Progress</option>
                    <option value="closed">Closed</option>
                </select>
                <div class="form-error"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="priority">Priority</label>
                <select class="form-input" id="priority" name="priority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Create Ticket</button>
                <button type="button" onclick="ticketsModule.closeCreateModal()" class="btn btn-secondary" style="flex: 1; background: #64748b; color: white;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Ticket Modal -->
<div id="editTicketModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000;">
    <div class="modal-content card" style="width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto;">
        <div class="modal-header" style="display: flex; justify-content: between; align-items: center; margin-bottom: 1.5rem;">
            <h3>Edit Ticket</h3>
            <button onclick="ticketsModule.closeEditModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
        </div>
        
        <form id="editTicketForm">
            <div class="form-group">
                <label class="form-label" for="editTitle">Title *</label>
                <input type="text" class="form-input" id="editTitle" name="title" required>
                <div class="form-error"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="editDescription">Description</label>
                <textarea class="form-input" id="editDescription" name="description" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="editStatus">Status *</label>
                <select class="form-input" id="editStatus" name="status" required>
                    <option value="open">Open</option>
                    <option value="in_progress">In Progress</option>
                    <option value="closed">Closed</option>
                </select>
                <div class="form-error"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="editPriority">Priority</label>
                <select class="form-input" id="editPriority" name="priority">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Update Ticket</button>
                <button type="button" onclick="ticketsModule.closeEditModal()" class="btn btn-secondary" style="flex: 1; background: #64748b; color: white;">Cancel</button>
            </div>
        </form>
    </div>
</div>
