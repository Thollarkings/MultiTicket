<div class="auth-container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc;">
    <div class="auth-card card" style="width: 100%; max-width: 400px; margin: 2rem;">
        <div class="auth-header" style="text-align: center; margin-bottom: 2rem;">
            <h2>{{auth_title}}</h2>
            <p style="color: #64748b;">{{auth_type === 'login' ? 'Sign in to your account' : 'Create your account'}}</p>
        </div>

        <form id="authForm">
            {{#if auth_type === 'signup'}}
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" class="form-input" id="name" name="name" required>
                <div class="form-error"></div>
            </div>
            {{/if}}

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" class="form-input" id="email" name="email" required>
                <div class="form-error"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-input" id="password" name="password" required>
                <div class="form-error"></div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">
                {{auth_button}}
            </button>

            <div style="text-align: center;">
                {{#if auth_type === 'login'}}
                <p>Don't have an account? <a href="#signup" style="color: #3b82f6; text-decoration: none;">Sign up</a></p>
                {{else}}
                <p>Already have an account? <a href="#login" style="color: #3b82f6; text-decoration: none;">Login</a></p>
                {{/if}}
            </div>
        </form>
    </div>
</div>
