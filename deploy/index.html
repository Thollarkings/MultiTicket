<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Framework Ticket App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 800px;
            text-align: center;
            padding: 2rem;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: bold;
        }
        
        p {
            font-size: 1.25rem;
            margin-bottom: 3rem;
            opacity: 0.9;
        }
        
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .app-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            transition: transform 0.2s, background 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .app-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .app-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .app-title {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        
        .app-description {
            opacity: 0.8;
            line-height: 1.5;
        }
        
        @media (max-width: 768px) {
            .apps-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TicketFlow</h1>
        <p>Multi-Framework Ticket Management System</p>
        
        <div class="apps-grid">
            <a href="./react-app/" class="app-card">
                <div class="app-icon">⚛️</div>
                <div class="app-title">React App</div>
                <div class="app-description">Complete ticket management system built with React 18</div>
            </a>
            
            <a href="./vue-app/" class="app-card">
                <div class="app-icon">💚</div>
                <div class="app-title">Vue.js App</div>
                <div class="app-description">Identical functionality built with Vue.js 3</div>
            </a>
        </div>
    </div>
</body>
</html>
